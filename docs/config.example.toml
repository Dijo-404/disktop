# Disktop configuration. Copy to $XDG_CONFIG_HOME/disktop/config.toml
# (or ~/.config/disktop/config.toml) and change only what you need; every
# omitted setting keeps its default. An unknown or misspelled key is an error
# rather than a silently ignored line, so a typo cannot disable a guard.
#
# Supported syntax is a subset of TOML: tables, bare keys, double-quoted
# strings, integers, booleans, and single-line arrays.

# "iec" shows KiB/MiB/GiB; "si" shows kB/MB/GB.
units = "iec"

[alerts]
space_threshold_percent = 90
inode_threshold_percent = 90
# Send a desktop notification when `disktop alerts check` crosses a threshold.
# Requires notify-send; Disktop never schedules cleanup.
notify = false

[scan]
# Scans stay inside one filesystem unless this is enabled.
cross_filesystems = false
# "allocated" counts st_blocks * 512; "apparent" counts st_size.
accounting = "allocated"
# Exclude /mnt/c and /mnt/wsl even if their path is selected explicitly.
# Set false to scan one of those paths. The WSL diagnostic offers no cleanup.
exclude_windows_mounts = true
excludes = ["/proc", "/sys", "/dev", "/run"]
# Byte budget for the helper's index, one file per scan. When the files grow
# past it, whole older scans are removed, oldest first; the newest scan is never
# the one removed.
max_index_bytes = 2147483648  # 16 MiB to 1 TiB
# How many scans the index keeps, newest first, including the one being
# written. An older scan's file is removed rather than accumulated. The scans
# `disktop clean` takes to measure what it finds are kept apart, in an index of
# their own holding two scans and a quarter of max_index_bytes, so measuring
# never pushes out a scan of yours.
keep_scans = 3  # 1 to 100

[find]
# "Not modified since" threshold for stale candidates, in days. 1 to 3650.
stale_after_days = 183

[snapshots]
keep_latest = 20  # 1 to 1000

[cleanup]
# How long a reviewed plan stays applicable, in minutes. 1 to 1440, so a typo
# cannot leave a reviewed plan applicable indefinitely.
plan_expiry_minutes = 60
# Extra user-owned roots generic cleanup may act inside. Refused here: a
# protected system root, and a shared container root such as /home, /tmp,
# /var/tmp, /mnt, /media or /run/media, since allowing /home would reach every
# other account. A root listed here is the scope of cleanup, never a target
# itself. There is no setting that widens cleanup past this.
additional_allowed_roots = []

[managers]
# How much journal a vacuum keeps, in bytes. Only sealed, archived journal
# files are removed; the one being written stays. 16 MiB to 1 TiB.
journal_keep_bytes = 536870912

[providers]
# Directories holding AppImages, which no package manager knows about. These
# are read, never cleaned: an AppImage is only offered for the Trash when it
# belongs to you and sits inside your home directory, so listing /opt here is
# a place to look rather than a place to act. Absolute, normalized paths.
app_image_roots = []
# Directory names that mark regenerable build output. Names, never paths: a
# value with a slash in it would read as a path and invite pointing a detector
# at a system directory.
artifact_directories = ["node_modules", "target", "__pycache__", ".next", ".nuxt", "build", "dist"]
# The size above which a log file is reported on its own. 1024 to 1 TiB.
# Reporting is all that happens: no log is ever offered for truncation.
large_log_bytes = 134217728
# The cap that keeps one noisy detector from flooding the finding list. A
# detector that finds more says so in a warning rather than silently listing
# fewer. 1 to 1000.
max_findings_per_provider = 50

# Cleanup rules you write yourself.
#
# A rule is data and only data: where to look, what to match, how old and how
# large, and hard limits on how much it may select. There is no setting for a
# command, and no combination of these turns one into a program Disktop runs.
#
# What a rule produces is a finding like any other. It appears in `disktop
# clean`, it is reviewed into a plan with `disktop clean plan`, and nothing
# happens until `disktop clean apply ... --yes`. The plan records which rule it
# came from; if you edit the rule afterwards, the plan is refused and you are
# asked to review it again against what the rule now says.
#
# Roots are checked against the same policy as everything else: a protected
# system root or a shared container root such as /home is refused outright.

# [[rules]]
# name = "old disk images in Downloads"
# roots = ["/home/example/Downloads"]
# globs = ["*.iso", "*.img"]
# excludes = ["keep-*"]
# kinds = ["file"]            # "file", "directory", or both. Defaults to file.
# minimum_age_days = 30       # Not modified for this long.
# minimum_bytes = 104857600   # At least this large on disk.
# maximum_count = 50          # The rule stops here, and says that it did.
# maximum_bytes = 10737418240 # And here.

# [[rules]]
# name = "stale Rust build output"
# roots = ["/home/example/projects"]
# globs = ["**/target"]       # ** crosses directory levels; * does not.
# kinds = ["directory"]
# minimum_age_days = 60
# minimum_bytes = 0
# maximum_count = 20
# maximum_bytes = 53687091200
