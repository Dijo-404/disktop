[package]
name = "disktop-fs"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
zstd = "0.14"

# The packaged helpers. `panic` stays "unwind" on purpose: protocol.rs catches a
# panicking worker with catch_unwind so its request is still settled with an
# error event, and "abort" would turn that into a dead helper and a client
# waiting on an answer that never comes.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
