name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Rust, and Linux integration (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - name: Install npm dependencies
        run: npm ci
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path native/disktop-fs/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path native/disktop-fs/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path native/disktop-fs/Cargo.toml
      - name: Linux sandbox integration
        run: npm run test:integration
      - name: Terminal smoke tests
        run: npm run test:pty
      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

  distro-smoke:
    name: ${{ matrix.distro }} container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu
            image: node:24-bookworm
          - distro: Fedora
            image: fedora:latest
          - distro: Arch
            image: archlinux:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install container prerequisites
        shell: sh
        run: |
          case '${{ matrix.distro }}' in
            Ubuntu) apt-get update && apt-get install -y git ca-certificates tar gzip util-linux ;;
            Fedora) dnf install -y git ca-certificates tar gzip util-linux ;;
            Arch) pacman -Sy --noconfirm git ca-certificates tar gzip util-linux ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm dependencies
        run: npm ci
      - name: Build and exercise non-interactive CLI
        run: |
          npm run build
          npm run test:pty
