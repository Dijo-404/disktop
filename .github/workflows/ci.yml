name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Rust, and Linux integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - name: Install npm dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm audit
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and contract tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Rust format
        run: cargo fmt --manifest-path native/disktop-fs/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path native/disktop-fs/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path native/disktop-fs/Cargo.toml
      - name: Linux sandbox integration
        run: npm run test:integration
      - name: Journal recovery
        run: npm run test:recovery
      - name: Terminal smoke tests
        run: npm run test:pty
      # The default tree size; `npm run bench` is the million-entry run.
      - name: Scan memory and latency budget
        env:
          DISKTOP_REQUIRE_RELEASE_BENCHMARK: '1'
        run: |
          npm run build
          npm run build:native
          cargo build --release --locked --manifest-path native/disktop-fs/Cargo.toml
          node --test tests/performance/*.test.mjs

  dependency-security:
    name: Rust dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and advisory checker
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          cargo install --locked cargo-audit --version 0.22.2
      - name: Check the helper lockfile against RustSec
        run: cargo audit --file native/disktop-fs/Cargo.lock --deny warnings

  release-binaries:
    name: Release helpers for four Linux targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/release-toolchain
      # Builds --release --locked with cargo zigbuild, checks each binary's ELF
      # machine, interpreter, stripping, and glibc floor against its name,
      # writes SHA256SUMS, and asks the two x86-64 builds hello.
      - name: Build and record the four helpers
        run: node scripts/build-release.mjs
      - name: Check checksums and executable bits
        working-directory: vendor/bin
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          for binary in \
            disktop-fs-linux-x64-gnu \
            disktop-fs-linux-x64-musl \
            disktop-fs-linux-arm64-gnu \
            disktop-fs-linux-arm64-musl; do
            test -x "$binary"
          done
      # An artifact upload drops file modes, so the helpers travel as a tar.
      - name: Archive the helpers with their modes
        run: tar -cf disktop-helpers.tar -C vendor/bin SHA256SUMS disktop-fs-linux-x64-gnu disktop-fs-linux-x64-musl disktop-fs-linux-arm64-gnu disktop-fs-linux-arm64-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disktop-helpers
          path: disktop-helpers.tar
          if-no-files-found: error
          retention-days: 7

  filesystem-faults:
    name: Full and read-only filesystem safety
    needs: release-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: disktop-helpers
          path: .release-helpers
      - name: Prepare the application and release helpers
        run: |
          tar -xf .release-helpers/disktop-helpers.tar -C vendor/bin
          npm ci
          npm run build
      # Keep real root ownership visible to the journal while running the app
      # as an ordinary user. Only the disposable container receives mount
      # capability; the checkout is read-only and all mutation uses tmpfs.
      - name: Require the actual filesystem fault cases, without skips
        run: >-
          docker run --rm --cap-add SYS_ADMIN
          --security-opt seccomp=unconfined --security-opt apparmor=unconfined
          --env DISKTOP_TEST_REQUIRE_FILESYSTEM_FAULTS=1 --env HOME=/tmp
          --volume "$GITHUB_WORKSPACE:/disktop:ro" --workdir /disktop
          node:24-bookworm sh -c
          'chmod u-s /usr/bin/mount /usr/bin/umount;
          unshare --mount --fork setpriv --reuid "$(stat -c %u /disktop)"
          --regid "$(stat -c %g /disktop)" --clear-groups
          --inh-caps +sys_admin --ambient-caps +sys_admin
          node --test tests/integration/filesystem-failures.test.mjs'

  helper-handshake:
    name: Helper handshake
    needs: release-binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: disktop-helpers
          path: .release-helpers
      - name: Unpack and check the helpers
        run: |
          set -euo pipefail
          tar -xf .release-helpers/disktop-helpers.tar -C vendor/bin
          (cd vendor/bin && sha256sum --check --strict SHA256SUMS)
      # Each run sends the client's own hello and requires the package version
      # and a release build checksum back. Every command is an argument vector.
      - name: glibc build on this runner
        run: >-
          node scripts/helper-hello.mjs --expect-version "$(node -p 'require("./package.json").version')" --expect-release --
          "vendor/bin/disktop-fs-linux-${{ matrix.arch }}-gnu"
      - name: glibc build on the glibc 2.28 floor (AlmaLinux 8)
        run: >-
          node scripts/helper-hello.mjs --expect-version "$(node -p 'require("./package.json").version')" --expect-release --
          docker run --rm -i --volume "$PWD/vendor/bin:/helpers:ro" almalinux:8
          "/helpers/disktop-fs-linux-${{ matrix.arch }}-gnu"
      - name: static musl build on Alpine
        run: >-
          node scripts/helper-hello.mjs --expect-version "$(node -p 'require("./package.json").version')" --expect-release --
          docker run --rm -i --volume "$PWD/vendor/bin:/helpers:ro" alpine:3.24
          "/helpers/disktop-fs-linux-${{ matrix.arch }}-musl"
      - name: static musl build on this glibc runner
        run: >-
          node scripts/helper-hello.mjs --expect-version "$(node -p 'require("./package.json").version')" --expect-release --
          "vendor/bin/disktop-fs-linux-${{ matrix.arch }}-musl"

  package:
    name: Packed package
    needs: release-binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: disktop-helpers
          path: .release-helpers
      - name: Unpack the helpers into vendor/bin
        run: tar -xf .release-helpers/disktop-helpers.tar -C vendor/bin
      - name: Install npm dependencies
        run: npm ci
      # Packs, compares the tarball to its allowlist, installs it globally and
      # through npm exec with a throwaway HOME and npm cache, runs the CLI and
      # its helper, and proves a tampered helper is refused.
      - name: Package smoke test
        env:
          DISKTOP_PACKAGE_REQUIRE_ALL_TARGETS: '1'
        run: npm run test:package

  package-musl:
    name: Packed package on musl
    needs: release-binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: disktop-helpers
          path: .release-helpers
      - name: Unpack the helpers into vendor/bin
        run: tar -xf .release-helpers/disktop-helpers.tar -C vendor/bin
      - name: Install npm dependencies
        run: npm ci
      # Node's musl build selects the musl helper; this is the only job where
      # the locator's musl path runs end to end. The runner's own account keeps
      # the checkout writable and keeps the run out of the root-only checks.
      - name: Package smoke test in node:24-alpine
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --env HOME=/tmp --env DISKTOP_PACKAGE_REQUIRE_ALL_TARGETS=1
          --volume "$GITHUB_WORKSPACE:/disktop" --workdir /disktop
          node:24-alpine3.24 npm run test:package

  distro-smoke:
    name: Container smoke test
    needs: release-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu
            image: ubuntu:24.04
          - distro: Fedora
            image: fedora:latest
          - distro: Arch
            image: archlinux:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install container prerequisites
        shell: sh
        run: |
          case '${{ matrix.distro }}' in
            Ubuntu) apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl tar gzip xz-utils util-linux bsdutils passwd ;;
            Fedora) dnf install -y git ca-certificates tar gzip xz util-linux util-linux-script shadow-utils systemd ;;
            Arch) pacman -Syu --noconfirm git ca-certificates tar gzip xz util-linux shadow ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: disktop-helpers
          path: .release-helpers
      # A container job runs as root, and Disktop runs as root only from an
      # install root alone can change. The checkout is not one, so the suites
      # run as an ordinary account, and root is exercised separately below
      # from a root-owned global install.
      - name: Hand the checkout to an unprivileged account
        shell: sh
        run: |
          set -eu
          useradd --create-home --shell /bin/sh disktop
          tar -xf .release-helpers/disktop-helpers.tar -C vendor/bin
          chown -R disktop:disktop "$GITHUB_WORKSPACE"
      - name: Install, build, terminal tests, and package smoke test as that account
        shell: sh
        run: >-
          runuser -u disktop -- env "PATH=$PATH" HOME=/home/disktop DISKTOP_PACKAGE_REQUIRE_ALL_TARGETS=1
          sh -c 'npm ci && npm run test:pty && node --test tests/integration/managers-host.test.mjs && npm run test:package'
      # A container may not reach lsblk or every mount, which is an incomplete
      # result (3), not a failure. An operational error (2) still fails the job.
      - name: Read this container's inventory as that account
        shell: sh
        run: |
          set -u
          inventory() {
            runuser -u disktop -- env "PATH=$PATH" HOME=/home/disktop node dist/bin/disktop.js "$@" > /dev/null && status=0 || status=$?
            case "$status" in
              0|1|3) echo "disktop $* exited $status" ;;
              *) echo "disktop $* exited $status"; exit 1 ;;
            esac
          }
          inventory devices --json
          inventory --json
          inventory alerts check --json
      - name: Run as root only from a root-owned global install
        shell: sh
        run: |
          set -eu
          # setup-node's shared tool cache can belong to the host runner's
          # account. Disktop also checks Node's ownership under EUID 0, so
          # give this container its own root-owned executable for this check.
          install --mode=0755 "$(command -v node)" /usr/local/bin/node
          export PATH="/usr/local/bin:$PATH"
          runuser -u disktop -- env "PATH=$PATH" HOME=/home/disktop npm pack --ignore-scripts --pack-destination /tmp
          npm install --global --prefix /usr/local --ignore-scripts /tmp/disktop-*.tgz
          as_root() {
            /usr/local/bin/disktop "$@" > /tmp/disktop-root-result.json && status=0 || status=$?
            case "$status" in
              0|1|3) echo "root: disktop $* exited $status" ;;
              *) echo "root: disktop $* exited $status"; cat /tmp/disktop-root-result.json; exit 1 ;;
            esac
          }
          as_root devices --json
          as_root --json
          # The same code from a checkout another account owns is refused.
          node dist/bin/disktop.js --json > /tmp/refused.json && status=0 || status=$?
          test "$status" = 2
          node -e 'const e = JSON.parse(require("fs").readFileSync("/tmp/refused.json", "utf8")); if (e.error?.code !== "permission-denied") { console.error(JSON.stringify(e)); process.exit(1); }'
          echo "root from a checkout another account owns was refused as permission-denied"
