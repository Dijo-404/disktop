name: Bug report
description: Report a reproducible Disktop problem that can be discussed publicly.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        If this may expose data or allow unintended deletion, protected-path bypass, restore corruption, or command injection, stop and report it privately using [SECURITY.md](https://github.com/Dijo-404/disktop/blob/main/SECURITY.md). Do not post exploitable steps, real paths, or personal data in a public issue.
        For passed or blocked acceptance checks, use the Test result form and follow the [tester guide](https://github.com/Dijo-404/disktop/blob/main/docs/tester-guide.md).
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Devices and capacity
        - Scanning, index, or snapshots
        - Findings and application inventory
        - Cleanup, Trash, or undo
        - CLI, TUI, or reports
        - Installation or packaging
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and artifact identity
      description: Include disktop --version and the installation method. For source or CI builds give the exact commit; for a tarball give its SHA-256.
      placeholder: "Version, npm or tarball or source install, commit or tarball SHA-256"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Linux environment
      description: Include distribution, kernel, architecture, libc, node --version, and relevant tool versions. Add filesystem or mount type, WSL version, and terminal details where relevant. Omit private hostnames and paths.
      placeholder: "Distribution, kernel, architecture/libc, Node, manager/tool versions, filesystem, WSL or terminal details"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a temporary fixture or harmless command. Name any tester-guide check or manager action involved. Do not run cleanup against real data to reproduce a bug.
      placeholder: |
        1. Create a small fixture under a temporary directory.
        2. Run the command or open the view.
        3. Observe the result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Include expected counts, sizes, or action scope when they matter.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include incomplete-result or permission messages as shown, with sensitive details removed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include commands, stdout/stderr, exit codes or screenshots when available. Remove usernames, private paths and filenames (including bytesBase64), tokens and hostnames before posting. Keep exploitable details private.
    validations:
      required: false
  - type: checkboxes
    id: public-report
    attributes:
      label: Public report check
      options:
        - label: I read SECURITY.md and removed private data and exploitable security details from this report.
          required: true
