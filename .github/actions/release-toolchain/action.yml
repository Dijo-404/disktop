name: Release toolchain
description: >-
  The pinned Rust toolchain with the four Linux release targets, zig, and
  cargo-zigbuild that scripts/build-release.mjs builds the packaged helpers
  with. CI and the publish workflow both use this, so a release is built
  exactly the way every push is. x86-64 runners only.

runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain and the four release targets
      shell: bash
      run: >-
        rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
        --target x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl

    - name: Install pinned zig, checked against its published SHA-256
      shell: bash
      env:
        ZIG_VERSION: 0.16.0
        ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      run: |
        set -euo pipefail
        test "$(uname -m)" = x86_64
        archive="$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
        curl --fail --silent --show-error --location --retry 3 --output "$archive" \
          "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
        echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
        tar -xJf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

    - name: Install pinned cargo-zigbuild from its lockfile
      shell: bash
      run: cargo install --locked cargo-zigbuild --version 0.23.4
