version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Match the Node 24 minimum runtime and CI toolchain.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-development:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /native/disktop-fs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
